<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; base-uri 'self'; form-action 'none'; object-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>CoinCubo — Links</title>
<meta name="description" content="Research cripto em português: site, newsletter e grupo do Telegram da CoinCubo.">
<meta property="og:title" content="CoinCubo — Links">
<meta property="og:description" content="Site, newsletter e grupo do Telegram da CoinCubo.">
<meta property="og:image" content="https://coincubo.com/assets/cubo.png">
<meta name="theme-color" content="#05050A">
<link rel="icon" href="../assets/cubo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Mesma paleta do coincubo.com (brands/coincubo/BRAND.md). */
  :root {
    --ink:#05050A; --surface:#0E0E18; --line:#1C1C2A; --text:#FFFFFF; --muted:#9A9AB0;
    --pink:#EB499F; --violet:#840FEA; --blue:#3281EA; --cyan:#06C9DF; --up:#2FE39A;
    --topo:linear-gradient(120deg, var(--pink), var(--violet)); --lado:linear-gradient(120deg, var(--blue), var(--cyan));
    --vidro:rgba(14,14,24,.72); --linha-forte:#2c2c40; --brilho-v:rgba(132,15,234,.24); --brilho-c:rgba(6,201,223,.16);
    --mistura:lighten; color-scheme:dark;
  }
  @media (prefers-color-scheme: light) { :root {
    --ink:#F7F7FB; --surface:#FFFFFF; --line:#E3E3EE; --text:#0B0B16; --muted:#5E5E74; --up:#0E9F6E;
    --vidro:rgba(255,255,255,.82); --linha-forte:#C9C9DA; --brilho-v:rgba(132,15,234,.12); --brilho-c:rgba(6,201,223,.12);
    --mistura:normal; color-scheme:light;
  } }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:var(--ink); }
  body { color:var(--text); font:16px/1.5 "Inter", system-ui, sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh;
    display:flex; justify-content:center; padding:48px 16px 32px; overflow-x:hidden; }
  .luz { position:fixed; width:640px; height:640px; border-radius:50%; filter:blur(40px); pointer-events:none; z-index:-1; }
  .luz.v { background:radial-gradient(circle, var(--brilho-v), transparent 62%); top:-300px; left:-280px; }
  .luz.c { background:radial-gradient(circle, var(--brilho-c), transparent 62%); bottom:-320px; right:-300px; }
  .grade { position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.35;
    background-image:linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:48px 48px; mask-image:radial-gradient(ellipse at 50% 15%, #000 10%, transparent 65%); }
  main { width:100%; max-width:440px; text-align:center; }
  .cubo { width:132px; height:132px; display:block; margin:0 auto 6px; mix-blend-mode:var(--mistura);
    filter:drop-shadow(0 20px 50px rgba(132,15,234,.45)); animation:flutua 7s ease-in-out infinite; }
  @keyframes flutua { 50% { transform:translateY(-6px) rotate(-2deg); } }
  h1 { font:800 34px/1.05 "Inter Tight", "Inter", sans-serif; letter-spacing:-.03em; }
  .gradiente { background:var(--topo); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .selo { display:inline-flex; align-items:center; gap:8px; margin:14px 0 30px; font-size:12px; font-weight:600; letter-spacing:.08em;
    text-transform:uppercase; color:var(--muted); border:1px solid var(--line); background:var(--vidro); padding:7px 13px; border-radius:999px; }
  .selo i { width:7px; height:7px; border-radius:50%; background:var(--up); box-shadow:0 0 10px var(--up); }
  ul { list-style:none; display:grid; gap:12px; text-align:left; }
  .link { position:relative; display:flex; align-items:center; gap:14px; padding:16px 18px; border-radius:16px; overflow:hidden;
    background:var(--vidro); border:1px solid var(--line); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    color:var(--text); text-decoration:none; transition:transform .15s, border-color .15s, box-shadow .15s; }
  .link::before { content:""; position:absolute; inset:0 0 auto 0; height:2px; background:var(--lado); opacity:.9; }
  .link:hover { transform:translateY(-2px); border-color:var(--linha-forte); box-shadow:0 14px 36px rgba(0,0,0,.25); }
  .link:active { transform:scale(.99); }
  .link:focus-visible { outline:2px solid var(--cyan); outline-offset:3px; }
  .ic { width:46px; height:46px; flex:none; border-radius:12px; display:grid; place-items:center; background:rgba(6,201,223,.10); color:var(--cyan); }
  .ic svg { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .txt { flex:1; min-width:0; }
  .txt b { display:block; font:700 18px/1.2 "Inter Tight", "Inter", sans-serif; letter-spacing:-.01em; }
  .txt small { display:block; margin-top:3px; font-size:14px; color:var(--muted); }
  .seta { color:var(--muted); font-size:18px; transition:transform .15s, color .15s; }
  .link:hover .seta { transform:translateX(3px); color:var(--text); }
  /* Destaque: o site, primeiro da lista. */
  .link.principal { background:radial-gradient(400px 160px at 0% 0%, rgba(132,15,234,.32), transparent 70%), radial-gradient(400px 160px at 100% 100%, rgba(6,201,223,.22), transparent 70%), var(--surface); }
  .link.principal::before { background:var(--topo); }
  .link.newsletter .ic { background:rgba(235,73,159,.12); color:var(--pink); }
  .link.newsletter::before { background:var(--topo); }
  footer { margin-top:30px; font-size:12px; color:var(--muted); }
  footer p + p { margin-top:4px; font-style:italic; }
  @media (prefers-reduced-motion:reduce) { .cubo { animation:none; } }
</style>
</head>
<body>
<div class="luz v"></div><div class="luz c"></div><div class="grade"></div>
<main>
  <img class="cubo" src="../assets/cubo.png" alt="Logo da CoinCubo" width="132" height="132">
  <h1>Coin<span class="gradiente">Cubo</span></h1>
  <span class="selo"><i></i>Research cripto em português</span>

  <ul>
    <li><a class="link principal" href="https://coincubo.com">
      <span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg></span>
      <span class="txt"><b>Site da CoinCubo</b><small>Ranking cripto ao vivo e análises</small></span>
      <span class="seta" aria-hidden="true">→</span></a></li>
    <li><a class="link newsletter" href="https://coincubo.substack.com" target="_blank" rel="noopener">
      <span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></span>
      <span class="txt"><b>Newsletter</b><small>Grátis, direto no seu e-mail</small></span>
      <span class="seta" aria-hidden="true">→</span></a></li>
    <li hidden data-telegram><a class="link" href="#" target="_blank" rel="noopener">
      <span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg></span>
      <span class="txt"><b>Grupo no Telegram</b><small>Notícias do dia e enquetes</small></span>
      <span class="seta" aria-hidden="true">→</span></a></li>
  </ul>

  <footer>
    <p>© CoinCubo · coincubo.com</p>
    <p>Conteúdo educativo, não é recomendação de investimento.</p>
  </footer>
</main>
</body>
</html>
